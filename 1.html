<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blank Page</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #d9d3d3;
      color: white;
      font-family: Arial, sans-serif;
      position: relative;
    }

    .love-hearts {
      position: absolute;
      top: 10vh;
      left: 50%;
      transform: translateX(-50%);
      width: 70vw;
      max-width: 600px;
      height: 80px;
      pointer-events: none;
    }

    .love-hearts span {
      position: absolute;
      font-size: 50px;
      color: #6c0101;
      text-shadow: 0 0 8px rgba(255, 145, 190, 0.8);
      animation: floatHeart 2.6s ease-in-out infinite;
      opacity: 0.9;
    }

    .love-hearts span:nth-child(1) { left: 10%; top: 20px; animation-delay: 0s; }
    .love-hearts span:nth-child(2) { left: 25%; top: 0; animation-delay: 0.6s; }
    .love-hearts span:nth-child(3) { left: 46%; top: 18px; animation-delay: 1.1s; }
    .love-hearts span:nth-child(4) { left: 63%; top: 6px; animation-delay: 1.7s; }
    .love-hearts span:nth-child(5) { left: 82%; top: 20px; animation-delay: 2.2s; }

    @keyframes floatHeart {
      0% { transform: translateY(0) scale(0.9); opacity: 0.6; }
      50% { transform: translateY(-12px) scale(1.2); opacity: 1; }
      100% { transform: translateY(0) scale(0.9); opacity: 0.6; }
    }

    .envelope-button {
      position: relative;
      width: 35vw;
      min-width: 220px;
      max-width: 420px;
      aspect-ratio: 1.5 / 1;
      border: none;
      background-color: #d9d3d3e9;
      background-image: url('./vecteezy_heart-arrow_1186864.png');
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s ease;
      overflow: hidden;
      border-radius: 10px;
    }

    .envelope-button:hover {
      transform: scale(1.03);
    }

    .envelope-text {
      position: relative;
      z-index: 1;
      color: #f00650;
      font-weight: 700;
      letter-spacing: 2px;
      font-size: clamp(18px, 2vw, 30px);
      text-shadow: 0 1px 0 rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.18);
      padding: 8px 18px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="love-hearts" aria-hidden="true">
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
  </div>

  <button class="envelope-button" onclick="window.location.href='index.html'" aria-label="Open love page">
    <span class="envelope-text">CLICK ME</span>
  </button>
</body>
</html>
