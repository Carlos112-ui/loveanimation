<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You - 3D Heart</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap');

        /* Basic reset and background setup */
        body {
            margin: 0;
            overflow: hidden; /* Hide scrollbars */
            background-color: rgb(183, 167, 167);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            perspective: 800px; /* Gives the 3D depth effect */
            font-family: Arial, sans-serif;
        }

        .title-wrap {
            position: absolute;
            top: 7vh;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 20;
        }

        .burst-heart {
            position: relative;
            width: 50px;
            height: 50px;
            font-size: 38px;
            line-height: 1;
            display: grid;
            place-items: center;
            color: #ff4d88;
            text-shadow: 0 0 18px rgba(255, 93, 153, 0.9);
            animation: burstIn 2.6s ease-in-out infinite;
            transform-origin: center;
        }

        .burst-heart::before,
        .burst-heart::after {
            content: '❤';
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: rgba(255, 110, 170, 0.9);
            animation: sparkleBurst 2.6s ease-in-out infinite;
        }

        .title-text {
            color: #ffd6ea;
            font-family: 'Noto Naskh Arabic', serif;
            font-size: clamp(28px, 4vw, 56px);
            font-weight: 700;
            letter-spacing: 1px;
            white-space: nowrap;
            text-shadow: 0 0 12px rgba(255, 144, 196, 0.9), 0 0 24px rgba(255, 94, 154, 0.7);
            animation: floatTitle 2.8s ease-in-out infinite alternate;
        }

        .floating-hearts {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
        }

        .floating-hearts span {
            position: absolute;
            color: rgba(255, 110, 170, 0.9);
            font-size: 20px;
            animation: driftUp 5s linear infinite;
            opacity: 0;
            text-shadow: 0 0 12px rgba(255, 136, 186, 0.8);
        }

        @keyframes burstIn {
            0% {
                transform: scale(0.2) rotate(-30deg);
                opacity: 0;
            }
            20% {
                transform: scale(1.2) rotate(10deg);
                opacity: 1;
            }
            35% {
                transform: scale(1.7) rotate(-8deg);
            }
            55% {
                transform: scale(1.1) rotate(0deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        @keyframes sparkleBurst {
            0% {
                transform: scale(0.4);
                opacity: 0;
            }
            30% {
                transform: scale(1.8);
                opacity: 1;
            }
            55% {
                transform: scale(2.3);
                opacity: 0.8;
            }
            100% {
                transform: scale(2.8);
                opacity: 0;
            }
        }

        @keyframes floatTitle {
            0% {
                transform: translateY(0px) scale(1);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10px) scale(1.04);
                opacity: 1;
            }
        }

        @keyframes driftUp {
            0% {
                transform: translateY(15px) scale(0.5) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            100% {
                transform: translateY(-120px) scale(1.4) rotate(25deg);
                opacity: 0;
            }
        }

        /* The container that holds all the words and rotates */
        .heart-container {
            position: relative;
            transform-style: preserve-3d;
            animation: rotateHeart 20s infinite linear;
        }

        /* Styling for the individual "I love you" texts */
        .love_word {
            position: absolute;
            color: #e2035c; /* Soft pink */
            text-shadow: 0 0 8px #ff6699; /* Adds a glowing effect */
            font-size: 14px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            white-space: nowrap;
            transform-style: preserve-3d;
            opacity: 0.8;
            /* Center the starting point */
            left: 50%;
            top: 50%;
        }

        /* The keyframes for the continuous 3D rotation */
        @keyframes rotateHeart {
            0% {
                transform: rotateY(0deg) rotateX(10deg);
            }
            100% {
                transform: rotateY(360deg) rotateX(10deg);
            }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" aria-hidden="true">
        <span style="left: 12%; top: 18%; animation-delay: 0s;">❤</span>
        <span style="left: 22%; top: 32%; animation-delay: 1.4s;">❤</span>
        <span style="left: 72%; top: 16%; animation-delay: 0.7s;">❤</span>
        <span style="left: 82%; top: 36%; animation-delay: 2.1s;">❤</span>
        <span style="left: 58%; top: 24%; animation-delay: 1.1s;">❤</span>
        <span style="left: 38%; top: 18%; animation-delay: 2.8s;">❤</span>
    </div>

    <div class="title-wrap">
        <div class="burst-heart">❤</div>
        <div class="title-text">I LOVE YOU MAMA</div>
    </div>

    <!-- This empty div is where Javascript will inject the words -->
    <div class="heart-container" id="heart-container"></div>

    <script>
        const container = document.getElementById('heart-container');
        const numberOfWords = 180; // Fewer words = clearer, less crowded heart

        for (let i = 0; i < numberOfWords; i++) {
            // 1. Generate a random parameter 't' from 0 to 2*PI for the math equation
            const t = Math.PI * 2 * Math.random();
            
            // 2. The standard mathematical parametric equation for a heart shape
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            
            // 3. Scale the coordinates up so it fills the screen nicely
            x = x * 12;
            y = y * 12;
            
            // 4. Add a random Z-axis depth so it forms a 3D cloud rather than a flat line
            let z = (Math.random() - 0.5) * 150;

            // 5. Create a new div element for the word
            const wordElement = document.createElement('div');
            wordElement.className = 'love_word';
            wordElement.textContent = 'I love you mama';
            
            // 6. Apply random rotations to the individual words to make it look scattered
            const rotateY = Math.random() * 360;
            const rotateZ = Math.random() * 20 - 10; // slight tilt

            // 7. Apply the calculated positions to the CSS transform
            wordElement.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateY(${rotateY}deg) rotateZ(${rotateZ}deg)`;
            
            // 8. Add the word to the container
            container.appendChild(wordElement);
        }
    </script>

</body>
</html>
